<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タイマー</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f4f8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 48px 56px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      text-align: center;
      width: 360px;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      color: #888;
      letter-spacing: 0.1em;
      margin-bottom: 32px;
    }

    .display {
      font-size: 72px;
      font-weight: 300;
      color: #1a1a1a;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
      font-variant-numeric: tabular-nums;
    }

    .display.alarm {
      color: #ff4444;
      animation: pulse 0.6s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .alarm-label {
      font-size: 14px;
      color: #ff4444;
      font-weight: 600;
      letter-spacing: 0.1em;
      height: 20px;
      margin-bottom: 32px;
    }

    .inputs {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 36px;
    }

    .inputs input {
      width: 72px;
      padding: 10px 8px;
      font-size: 20px;
      text-align: center;
      border: 2px solid #e8e8e8;
      border-radius: 12px;
      outline: none;
      transition: border-color 0.2s;
      font-variant-numeric: tabular-nums;
    }

    .inputs input:focus {
      border-color: #4f8ef7;
    }

    .inputs span {
      font-size: 24px;
      color: #ccc;
      font-weight: 300;
    }

    .inputs label {
      font-size: 11px;
      color: #aaa;
      display: block;
      margin-top: 4px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    button {
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-start {
      background: #4f8ef7;
      color: white;
      flex: 1;
    }

    .btn-start:hover {
      background: #3a7de8;
    }

    .btn-reset {
      background: #f0f0f0;
      color: #666;
    }

    .btn-reset:hover {
      background: #e4e4e4;
    }

    .btn-stop-alarm {
      background: #ff4444;
      color: white;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      display: none;
    }

    .btn-stop-alarm.visible {
      display: block;
    }

    .btn-stop-alarm:hover {
      background: #e03333;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>TIMER</h1>
    <div class="display" id="display">00:00</div>
    <div class="alarm-label" id="alarm-label"></div>

    <div class="inputs" id="inputs">
      <div class="input-group">
        <input type="number" id="input-min" min="0" max="99" value="0" placeholder="0">
        <label>分</label>
      </div>
      <span>:</span>
      <div class="input-group">
        <input type="number" id="input-sec" min="0" max="59" value="10" placeholder="0">
        <label>秒</label>
      </div>
    </div>

    <div class="buttons" id="buttons">
      <button class="btn-start" id="btn-main" onclick="toggleTimer()">スタート</button>
      <button class="btn-reset" onclick="resetTimer()">リセット</button>
    </div>
    <button class="btn-stop-alarm" id="btn-stop-alarm" onclick="stopAlarm()">アラームを止める</button>
  </div>

  <audio id="alarm-sound" preload="auto"></audio>

  <script>
    let remaining = 0;
    let interval = null;
    let running = false;
    let alarmCtx = null;
    let alarmNodes = [];

    function pad(n) {
      return String(n).padStart(2, '0');
    }

    function updateDisplay(seconds) {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      document.getElementById('display').textContent = `${pad(m)}:${pad(s)}`;
    }

    function toggleTimer() {
      if (running) {
        pauseTimer();
      } else {
        startTimer();
      }
    }

    function startTimer() {
      if (!running && remaining === 0) {
        const m = parseInt(document.getElementById('input-min').value) || 0;
        const s = parseInt(document.getElementById('input-sec').value) || 0;
        remaining = m * 60 + s;
        if (remaining === 0) return;
      }

      running = true;
      document.getElementById('btn-main').textContent = '一時停止';
      document.getElementById('inputs').style.opacity = '0.4';
      document.getElementById('inputs').style.pointerEvents = 'none';

      interval = setInterval(() => {
        remaining--;
        updateDisplay(remaining);
        if (remaining <= 0) {
          clearInterval(interval);
          running = false;
          triggerAlarm();
        }
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(interval);
      running = false;
      document.getElementById('btn-main').textContent = 'スタート';
    }

    function resetTimer() {
      clearInterval(interval);
      running = false;
      remaining = 0;
      stopAlarm();
      updateDisplay(0);
      document.getElementById('btn-main').textContent = 'スタート';
      document.getElementById('inputs').style.opacity = '1';
      document.getElementById('inputs').style.pointerEvents = 'auto';
    }

    function triggerAlarm() {
      document.getElementById('display').classList.add('alarm');
      document.getElementById('alarm-label').textContent = '⏰ 時間です！';
      document.getElementById('btn-stop-alarm').classList.add('visible');
      document.getElementById('inputs').style.opacity = '0.4';
      playAlarmSound();
    }

    function stopAlarm() {
      document.getElementById('display').classList.remove('alarm');
      document.getElementById('alarm-label').textContent = '';
      document.getElementById('btn-stop-alarm').classList.remove('visible');
      document.getElementById('inputs').style.opacity = '1';
      document.getElementById('inputs').style.pointerEvents = 'auto';
      stopAlarmSound();
    }

    function playAlarmSound() {
      try {
        alarmCtx = new (window.AudioContext || window.webkitAudioContext)();
        function beep() {
          if (!alarmCtx) return;
          const osc = alarmCtx.createOscillator();
          const gain = alarmCtx.createGain();
          osc.connect(gain);
          gain.connect(alarmCtx.destination);
          osc.frequency.value = 880;
          osc.type = 'sine';
          gain.gain.setValueAtTime(0.4, alarmCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, alarmCtx.currentTime + 0.5);
          osc.start(alarmCtx.currentTime);
          osc.stop(alarmCtx.currentTime + 0.5);
          alarmNodes.push(osc);
        }
        beep();
        alarmInterval = setInterval(beep, 800);
        alarmNodes.push({ stop: () => clearInterval(alarmInterval) });
      } catch (e) {}
    }

    function stopAlarmSound() {
      if (alarmCtx) {
        alarmCtx.close();
        alarmCtx = null;
      }
      alarmNodes = [];
    }

    updateDisplay(0);
  </script>
</body>
</html>
